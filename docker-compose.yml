services:
  postgres:
    image: postgres:17-alpine
    container_name: finanzas-postgres
    restart: unless-stopped

    env_file:
      - .env

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "127.0.0.1:15433:5432"

    volumes:
      - finanzas_pgdata:/var/lib/postgresql/data

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    networks:
      - n8n-network

volumes:
  finanzas_pgdata:

networks:
  n8n-network:
    external: true
    name: n8n-traefik_default
