
services:
  api:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: finanzas-api

    restart: unless-stopped
    init: true

    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "3000"

      DB_HOST: finanzas-postgres
      DB_PORT: "5432"
      DB_NAME: finanzas
      DB_USER: finanzas_app
      DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD_required}
      DB_POOL_MAX: "10"

    expose:
      - "3000"

    networks:
      - n8n-traefik

    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/ready').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

    read_only: true

    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m

    cap_drop:
      - ALL

    security_opt:
      - no-new-privileges:true

    user: node

networks:
  n8n-traefik:
    external: true
    name: n8n-traefik_default
